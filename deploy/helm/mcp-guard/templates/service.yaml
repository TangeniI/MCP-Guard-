apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: mcp-guard
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: mcp-guard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: mcp, port: {{ .Values.service.port }}, targetPort: mcp}
    - {name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: metrics}
---
{{- if .Values.approvers }}
# The approval page gets its own Service so it can be exposed (or not)
# separately from the agent endpoint. Agents must not be able to reach it.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    app.kubernetes.io/name: mcp-guard
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: mcp-guard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin}
{{- end }}
